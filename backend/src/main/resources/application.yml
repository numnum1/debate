# Lokale Defaults passend zu infra/docker-compose.yml.
# Jeder Wert lässt sich per Umgebungsvariable überschreiben (z. B. SPRING_DATASOURCE_URL).

server:
  port: 8080

spring:
  application:
    name: debate-backend

  # Lokale Einstellungen mit Geheimnissen, nicht im Git (backend/.gitignore); überschreiben Werte aus dieser Datei
  config:
    import: optional:classpath:application-local.yml

  # Ohne ausdrücklich gesetztes Profil läuft lokal "dev" (u. a. Beispieldebatten aus DevSeed)
  profiles:
    default: dev

  # Nutzer, Debatten, Regelwerke, Zeitachse
  mongodb:
    uri: mongodb://debate:debate@localhost:27017/debate?authSource=admin

  # Ledger, Märkte, Pools
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger
    username: debate
    password: debate

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/debate

  modulith:
    events:
      jdbc:
        # Tabelle event_publication (Outbox für Modul-Events) in Postgres anlegen
        schema-initialization:
          enabled: true

debate:
  ai:
    onyx:
      # Onyx-API direkt, ohne nginx (infra/onyx/onyx.env, ONYX_API_PORT)
      url: http://localhost:3001
      # Persönliches Access Token aus Onyx (Scope write:chat), lokal in application-local.yml eintragen,
      # Anleitung in backend/README.md. Leer: Im Chat antwortet eine Attrappe statt der KI
      api-key: ${ONYX_API_KEY:}
      # Agent in Onyx, dessen Tools der Aufruf nutzt; 0 ist der Standard-Agent
      persona-id: 0
      # Nur diese Tools des Agents (IDs aus der Onyx-Tabelle tool): 3 = web_search, 7 = open_url.
      # Damit erzeugt die KI im Chat z. B. keine Bilder und führt keinen Code aus. Leer: alle Tools des Agents
      tool-ids: [3, 7]
    # Name hinter dem @ im Chat (Groß-/Kleinschreibung egal) → Modell in Onyx.
    # provider ist der Anzeigename des LLM-Anbieters in Onyx, version der Modellname dort; beides muss zur
    # Einrichtung in Onyx passen. EECC ist ein OpenAI-kompatibles Gateway mit allen Modellen; bezahlt ist
    # im Moment nur Gemma, die übrigen antworten erst, wenn ihr Guthaben aufgeladen ist
    models:
      grok:
        display-name: Grok
        provider: EECC
        version: grok-4-latest
      gpt:
        display-name: ChatGPT
        provider: EECC
        version: gpt-5.5
      claude:
        display-name: Claude
        provider: EECC
        version: claude-sonnet-5-5
      gemma:
        display-name: Gemma
        provider: EECC
        version: gemma-4-e4b-vision

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: always
