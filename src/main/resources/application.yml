server:
  port: 1933
  servlet:
    context-path: /api
  # WebSocket-Konfiguration
  tomcat:
    connection-timeout: 30000
    max-connections: 10000

spring:
  application:
    name: debate-server
  
  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/debate}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/debate/protocol/openid-connect/certs}

# MongoDB Configuration (wird von MongoConfig.java verwendet)
mongodb:
  uri: ${MONGODB_URI:mongodb://admin:password@localhost:27017/debate?authSource=admin}
  database: ${MONGODB_DATABASE:debate}

# Keycloak Configuration (für Referenz)
# Die Integration erfolgt über Spring Security OAuth2 Resource Server
# Realm: debate
# Auth Server: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
# Client ID: debate-server
# Client Secret: Wird für Token-Validierung nicht benötigt (nur issuer-uri und jwk-set-uri)

# Logging Configuration
logging:
  level:
    root: INFO
    info.mm.debate: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.keycloak: DEBUG

# Actuator Configuration (optional)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    try-it-out-enabled: true
    filter: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

