# Onyx Lite als headless KI-Backend: Chat, Agents und Tools wie Websuche, ohne Suchindex.
# Nutzt unverändert die Compose-Dateien aus onyx-main/ (liegt nicht im Git, siehe README):
#   - docker-compose.yml            Onyx-Standard
#   - docker-compose.onyx-lite.yml  Onyx' eigenes Overlay: kein OpenSearch, keine Model-Server, kein Redis, kein Worker
#   - onyx.override.yml             unsere Ergänzungen: Secret, API-Port, Admin-UI optional, kein MCP-Server, kein Code-Interpreter
# onyx.env setzt die Variablen (Image-Version, Ports, Secret).
#
#   docker compose -f infra/onyx/docker-compose.yml up -d --wait                        nur API
#   docker compose -f infra/onyx/docker-compose.yml --profile admin-ui up -d --wait     mit Admin-Oberfläche
#
# Unser Backend spricht die Onyx-API direkt unter http://localhost:3001 an.
# Admin-Oberfläche (nur zum Einrichten und Nachschauen: LLM-Anbieter, API-Key, Agents): http://localhost:3000

name: debate-onyx

include:
  - path:
      - ../../onyx-main/deployment/docker_compose/docker-compose.yml
      - ../../onyx-main/deployment/docker_compose/docker-compose.onyx-lite.yml
      - ./onyx.override.yml
    env_file: ./onyx.env
